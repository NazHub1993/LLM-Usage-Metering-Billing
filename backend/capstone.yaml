name: LLM-Usage-Metering-Billing
description: Usage Metering & Billing Engine — FastAPI + Supabase (Auth + Postgres) + Stripe test mode
run: uvicorn app.main:app --reload
seed: Free/Pro plans seeded via SQL migration (see README setup steps)
test: manual evidence — see EVIDENCE.md (no automated test suite this cycle)
base_url: http://localhost:8000
endpoints:
  - POST /api/v1/auth/register
  - POST /api/v1/auth/login
  - POST /api/v1/auth/refresh
  - POST /api/v1/auth/logout
  - GET  /api/v1/auth/me
  - GET  /api/v1/profile
  - PATCH /api/v1/profile
  - POST /api/v1/generate
  - GET  /api/v1/usage
  - GET  /api/v1/billing/success
  - POST /api/v1/webhooks/stripe
  - POST /api/v1/admin/usage/rollup